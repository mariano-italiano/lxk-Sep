<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kwiaty</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff4f8;
        color: #333;
        text-align: center;
    }

    header {
        background: #e86b9b;
        color: white;
        padding: 25px;
    }

    .galeria {
        display: flex;
        justify-content: center;
        gap: 20px;
        padding: 30px;
    }

    .galeria img {
        width: 30%;
        height: 220px;
        object-fit: cover;
        border-radius: 15px;
    }

    h2 { color: #d94b82; }
</style>
</head>

<body>
<header>
    <h1>🌸 Świat Kwiatów 🌷</h1>
    <p>Piękno natury w jednym miejscu</p>
</header>

<div class="galeria">
    <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946" alt="Kwiaty">
    <img src="https://images.unsplash.com/photo-1495231916356-a86217efff12" alt="Różowe kwiaty">
    <img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e" alt="Bukiet kwiatów">
</div>

<h2>Dlaczego lubimy kwiaty?</h2>
<p>Kwiaty dodają koloru, piękna i pozytywnej energii naszemu otoczeniu.</p>
</body>
</html>
